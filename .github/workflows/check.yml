# SPDX-License-Identifier: MIT
#
# The checks of every push and pull request.
#
# - `x86_64-linux` builds every flake check, evaluates the checks of both
#   systems, and runs the interactive and the negative tests. It then
#   relocks the fixtures with the network and fails when a lockfile
#   changes: the lock run must reproduce the committed lockfiles.
# - `aarch64-linux` builds every flake check on GitHub's arm runner.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build the flake checks
        run: nix flake check -L
      - name: Evaluate the checks of both systems
        run: nix flake check --all-systems --no-build
      - name: Run the interactive test
        run: tests/interactive.sh
      - name: Run the negative tests
        run: tests/negative.sh
      - name: Relock the fixtures and compare
        run: |
          tests/relock-fixtures.sh
          git diff --exit-code -- tests/fixtures

  aarch64-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build the flake checks
        run: nix flake check -L
